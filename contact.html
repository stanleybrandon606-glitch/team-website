<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Contact PixelPioneers for questions and collaboration."
    />

    <title>PixelPioneers | Contact</title>

    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/script.js" defer></script>
  </head>

  <body>
    <a href="#main-content" class="skip-link"> Skip to main content </a>

    <header class="site-header">
      <div class="container header-content">
        <a href="index.html" class="logo">PixelPioneers</a>

        <nav class="main-nav" aria-label="Main navigation">
          <button
            class="nav-toggle"
            aria-label="Toggle navigation"
            aria-expanded="false"
          >
            ☰
          </button>

          <ul class="nav-links">
            <li>
              <a href="index.html">Home</a>
            </li>

            <li>
              <a href="projects.html">Projects</a>
            </li>

            <li>
              <a href="contact.html" aria-current="page">Contact</a>
            </li>
          </ul>
        </nav>

        <button class="theme-toggle" aria-label="Toggle dark mode">🌙</button>
      </div>
    </header>

    <main id="main-content">
      <section class="page-hero">
        <div class="container">
          <h1>Contact Us</h1>

          <p>
            Have a question, idea or project in mind? We'd love to hear from
            you.
          </p>
        </div>
      </section>

      <section class="contact-section">
        <div class="container">
          <h2>Send Us a Message</h2>

          <form id="contact-form" novalidate>
            <div class="form-group">
              <label for="name">Full Name</label>

              <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                required
              />

              <p class="error-message" id="name-error"></p>
            </div>

            <div class="form-group">
              <label for="email">Email Address</label>

              <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email address"
                required
              />

              <p class="error-message" id="email-error"></p>
            </div>

            <div class="form-group">
              <label for="topic">Topic</label>

              <select id="topic" name="topic" required>
                <option value="">Select a topic</option>

                <option value="general">General Inquiry</option>

                <option value="collaboration">Collaboration</option>

                <option value="project">Project Discussion</option>

                <option value="other">Other</option>
              </select>

              <p class="error-message" id="topic-error"></p>
            </div>

            <div class="form-group">
              <label for="message">Your Message</label>

              <textarea
                id="message"
                name="message"
                rows="6"
                maxlength="500"
                placeholder="Write your message here..."
                required
              ></textarea>

              <p id="char-count" aria-live="polite">0/500 characters</p>

              <p class="error-message" id="message-error"></p>
            </div>

            <button type="submit" class="btn">Send Message</button>

            <p id="form-status" role="status" aria-live="polite"></p>
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>
          &copy; <span id="current-year">2026</span>
          PixelPioneers. All rights reserved.
        </p>
      </div>
    </footer>
  </body>
</html>
