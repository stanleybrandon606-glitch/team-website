<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Explore the projects developed by Team Byte."
    />

    <title>Team Byte | Projects</title>

    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/script.js" defer></script>
  </head>

  <body>
    <a href="#main-content" class="skip-link"> Skip to main content </a>

    <header class="site-header">
      <div class="container header-content">
        <a href="index.html" class="logo">Team Byte</a>

        <nav class="main-nav" aria-label="Main navigation">
          <button
            class="nav-toggle"
            aria-label="Toggle navigation"
            aria-expanded="false"
          >
            ☰
          </button>

          <ul class="nav-links">
            <li>
              <a href="index.html">Home</a>
            </li>

            <li>
              <a href="projects.html" aria-current="page">Projects</a>
            </li>

            <li>
              <a href="contact.html">Contact</a>
            </li>
          </ul>
        </nav>

        <button class="theme-toggle" aria-label="Toggle dark mode">🌙</button>
      </div>
    </header>

    <main id="main-content">
      <section class="page-hero">
        <div class="container">
          <h1>Our Projects</h1>

          <p>
            Explore some of the projects we have worked on using different web
            development technologies.
          </p>
        </div>
      </section>

      <section class="projects-section">
        <div class="container">
          <h2>Explore Our Work</h2>

          <p id="project-count" aria-live="polite">Loading projects...</p>

          <div class="project-filters" aria-label="Filter projects">
            <button class="filter-btn active" type="button" data-filter="all">
              All
            </button>

            <button class="filter-btn" type="button" data-filter="html">
              HTML
            </button>

            <button class="filter-btn" type="button" data-filter="css">
              CSS
            </button>

            <button class="filter-btn" type="button" data-filter="js">
              JavaScript
            </button>
          </div>

          <div id="project-list" class="project-grid">
            <!-- JavaScript will display projects here. -->
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>
          &copy; <span id="current-year">2026</span>
          Team Byte. All rights reserved.
        </p>
      </div>
    </footer>
  </body>
</html>
